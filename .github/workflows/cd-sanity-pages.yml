name: "CD: CMS Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options:

          - qa
          - prod

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: cms

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Resolve Environment Variables
        working-directory: ${{ github.workspace }}
        run: |
          ENV="${{ github.event.inputs.environment }}"
          CONFIG_FILE=".github/iac-config.json"
          
          # Prioritize GitHub vars, fallback to iac-config.json
          VAL_SANITY_PROJECT_ID="${{ vars.SANITY_PROJECT_ID }}"
          if [ -z "$VAL_SANITY_PROJECT_ID" ]; then
            VAL_SANITY_PROJECT_ID=$(jq -r --arg env "$ENV" '.environments[$env].extra_variables.SANITY_PROJECT_ID // empty' $CONFIG_FILE)
          fi
          
          VAL_SANITY_DATA_SET="${{ vars.SANITY_DATA_SET }}"
          if [ -z "$VAL_SANITY_DATA_SET" ]; then
            VAL_SANITY_DATA_SET=$(jq -r --arg env "$ENV" '.environments[$env].extra_variables.SANITY_DATA_SET // empty' $CONFIG_FILE)
          fi
          
          VAL_CF_PAGES_WEB_CMS_NAME="${{ vars.CF_PAGES_WEB_CMS_NAME }}"
          if [ -z "$VAL_CF_PAGES_WEB_CMS_NAME" ]; then
            VAL_CF_PAGES_WEB_CMS_NAME=$(jq -r --arg env "$ENV" '.environments[$env].extra_variables.CF_PAGES_WEB_CMS_NAME // empty' $CONFIG_FILE)
          fi
          
          VAL_CF_PAGES_PROD_BRANCH="${{ vars.CF_PAGES_PROD_BRANCH }}"
          if [ -z "$VAL_CF_PAGES_PROD_BRANCH" ]; then
            VAL_CF_PAGES_PROD_BRANCH=$(jq -r --arg env "$ENV" '.environments[$env].extra_variables.CF_PAGES_PROD_BRANCH // empty' $CONFIG_FILE)
          fi
          
          VAL_CF_ACCOUNT_ID="${{ vars.CF_ACCOUNT_ID }}"
          if [ -z "$VAL_CF_ACCOUNT_ID" ]; then
            VAL_CF_ACCOUNT_ID=$(jq -r --arg env "$ENV" '.environments[$env].cloudflare.account_id // .cloudflare.account_id // empty' $CONFIG_FILE)
          fi
          
          echo "SANITY_PROJECT_ID=$VAL_SANITY_PROJECT_ID" >> "$GITHUB_ENV"
          echo "SANITY_DATA_SET=$VAL_SANITY_DATA_SET" >> "$GITHUB_ENV"
          echo "CF_PAGES_WEB_CMS_NAME=$VAL_CF_PAGES_WEB_CMS_NAME" >> "$GITHUB_ENV"
          echo "CF_PAGES_PROD_BRANCH=$VAL_CF_PAGES_PROD_BRANCH" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT_ID=$VAL_CF_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun i

      - name: Build Project
        run: bun run build
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ env.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ env.SANITY_DATA_SET }}

      - name: Print Environment Variables
        run: |
          echo "CF_ACCOUNT_ID=${{ env.CF_ACCOUNT_ID }}"
          echo "CF_PAGES_WEB_CMS_NAME=${{ env.CF_PAGES_WEB_CMS_NAME }}"
          echo "SANITY_PROJECT_ID=${{ env.SANITY_PROJECT_ID }}"
          echo "SANITY_DATA_SET=${{ env.SANITY_DATA_SET }}"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ vars.CF_ACCOUNT_ID }}
          command: >
            pages deploy cms/dist
            --project-name=${{ env.CF_PAGES_WEB_CMS_NAME }} --branch=${{ env.CF_PAGES_PROD_BRANCH }}